# Phase-SHA V2 Stage 2C: R=18, full 32-bit W0 (crosses R=16 message schedule wall)
version: v2
experiment_name: r18_32b_v2
rounds: 18
domain_mode: int_range
num_bits: 32
msg_bytes_len: 4

# 2D Bit-Grid Architecture
d_bit: 48
n_heads: 3
n_blocks: 2
d_ff_mult: 2
share_blocks: false
grad_checkpointing: false
grad_scale: 2.0

# Unrolled Neural-Physics Loop
K_unroll: 8
K_infer: 64
damp: 0.36
infer_damp: 0.055
sde_noise_min: 0.10
sde_noise_max: 0.45
anneal_K: 256
anneal_chunk_size: 1024
anneal_eval_samples: 32
anneal_eta_max: 0.02
anneal_beta_max: 0.25

batch_size: 128
steps: 8000
lr_total_steps: 20000
warmup_steps: 400
lr: 5.0e-4
min_lr_ratio: 0.1
weight_decay: 0.02
grad_clip: 1.0
alpha_phys: 0.25

holdout_size: 2048
eval_batch_size: 256
eval_every: 1000
checkpoint_every: 1000
log_every: 200

cuda_memory_fraction: 0.80
seed: 303
holdout_seed: 20261122
