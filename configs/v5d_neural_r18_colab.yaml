# Phase-SHA V5D-Neural: Neural-Guided Metric & Damping RRR Solver (Colab A100 80GB)
version: v5
variant: v5d_neural
experiment_name: v5d_neural_r18_colab
rounds: 18
domain_mode: int_range
num_bits: 32
msg_bytes_len: 4

hidden_dim: 64
batch_size: 32
num_particles: 4
K_unroll: 16
bptt_chunk_len: 4
use_async_prefetch: true

rrr_beta_min: 0.38
rrr_beta_max: 1.08
rrr_init_scale: 0.85

alpha_phys: 1.0
wta_winner_weight: 0.85
bce_weight: 0.25

K_infer: 40
anneal_K: 128
anneal_chunk_size: 512
anneal_eval_samples: 64

steps: 2000
lr_total_steps: 4000
warmup_steps: 200
lr: 4.0e-4
min_lr_ratio: 0.1
weight_decay: 0.02
grad_clip: 1.0
ema_decay: 0.995

holdout_size: 2048
eval_batch_size: 256
eval_every: 250
checkpoint_every: 250
log_every: 50
best_ckpt_name: best.pt
latest_ckpt_name: latest.pt

cuda_memory_fraction: 0.92
use_torch_compile: auto
seed: 5052
holdout_seed: 20261122
