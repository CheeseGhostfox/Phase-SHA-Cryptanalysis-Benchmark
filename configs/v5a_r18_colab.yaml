lam_comm_end: 0.60
lam_align_start: 0.02
lam_align_mid: 1.50
lam_align_end: 6.00
lam_assoc_start: 0.02
lam_assoc_mid: 0.60
lam_assoc_end: 2.50

K_infer: 48
infer_damp: 0.25
anneal_K: 256
anneal_chunk_size: 2048
anneal_eval_samples: 64
anneal_eta_max: 0.025
anneal_beta_max: 0.25

steps: 2000
lr_total_steps: 4000
warmup_steps: 200
lr: 4.0e-4
min_lr_ratio: 0.1
weight_decay: 0.02
grad_clip: 1.0

holdout_size: 2048
eval_batch_size: 256
eval_every: 250
checkpoint_every: 250
log_every: 50
best_ckpt_name: best.pt
latest_ckpt_name: latest.pt

cuda_memory_fraction: 0.92
seed: 5055
holdout_seed: 20261122
