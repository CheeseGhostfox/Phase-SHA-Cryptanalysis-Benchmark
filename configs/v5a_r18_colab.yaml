# Phase-SHA V5A: 8D Non-Associative Octonion S^7 Solver (Colab A100 80GB)
version: v5
variant: v5a
experiment_name: v5a_r18_colab
rounds: 18
domain_mode: int_range
num_bits: 32
msg_bytes_len: 4

d_bit: 48
n_heads: 3
n_blocks: 2
d_ff_mult: 2
share_blocks: false
grad_checkpointing: false
use_carry_gru: true
grad_scale: 2.0
use_torch_compile: auto
torch_compile_mode: default
compile_physics: true
allow_rnn: false

batch_size: 48
num_particles: 4
K_unroll: 14
bptt_chunk_len: 4
backward_group_chunks: 4
use_async_prefetch: true
damp: 0.28
damp_jitter_min: 0.20
damp_jitter_max: 0.35
sync_h_damp: true
closed_loop_schedule: true
zero_init_prob: 0.85

alpha_phys: 1.0
wta_winner_weight: 0.85
bce_weight: 0.25
closed_loop_wall_rounds: [0, 13, 16]
closed_loop_bce_scale: 0.0
anti_collapse_weight: 0.05
logit_reg_weight: 0.001
wavefront_weight: 3.0
ema_decay: 0.995

w_xor: 1.0
lam_comm_start: 0.02
