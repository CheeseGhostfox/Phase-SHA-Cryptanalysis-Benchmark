# Stage 2: R=18 (crosses R=16 message schedule wall)
experiment_name: r18_schedule
rounds: 18
domain_mode: int_range
num_bits: 24
msg_bytes_len: 4

# Model architecture
d_model: 384
n_heads: 8
n_layers: 8
d_ff: 1024
share_layers: false
num_registers: 2
grad_checkpointing: false
grad_scale: 2.0

# Training hyperparameters (RTX 4060 Laptop 8GB VRAM)
batch_size: 512
steps: 40000
lr: 3.0e-4
weight_decay: 0.1
grad_clip: 1.0
warmup_steps: 1000
alpha_phys: 0.5
holdout_size: 2048
eval_batch_size: 256
eval_every: 500
checkpoint_every: 500
log_every: 50

# Inference / Annealing
anneal_K: 256
anneal_steps: 100
anneal_eval_samples: 64
anneal_gamma: 2.0
anneal_eta_max: 0.05
anneal_beta_max: 0.10
anneal_chunk_size: 1024

# Hardware
cuda_memory_fraction: 0.80
seed: 42
holdout_seed: 20261122
