model_type: v7c
seed: 7301
max_vram_gb: 11.0
strict_fp32: true

model:
  vocab_size: 32
  d_model: 512
  n_enc_layers: 2
  n_dec_layers: 7
  n_heads: 8
  d_ff: 1344
  n_prog_cond_tokens: 32
  max_prog_len: 256
  max_seq_len: 384
  dropout: 0.0

stage1:
  enabled: true
  steps: 1600
  batch_size: 48
  lr: 3.0e-4
  min_lr: 5.0e-5
  grad_clip: 1.0
  log_every: 40
  prog_len: 48
  max_seconds: 360.0
  tiers: [0, 1, 2, 3]
  n_inputs: 2

training:
  lr: 2.5e-4
  min_lr: 2.5e-5
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 150
  batch_size: 48
  eval_batch_size: 32
  rounds_schedule: [2, 3, 4, 5, 6, 8]
  steps_per_round: 3500
  max_sec_per_round: 540.0
  eval_every: 400
  log_every: 25
  n_eval: 256
  pass_k: 64
  advance_pass64: 0.50
  v6a_mix_prob: 0.25
  v6a_mix_rounds: [4, 5, 6]
  sample_temperature: 0.75
  sample_top_p: 0.95
