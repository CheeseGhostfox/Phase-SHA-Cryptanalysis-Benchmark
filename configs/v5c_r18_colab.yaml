# Phase-SHA V5C: Loop-Aware MPS Tensor Network Solver (Colab A100 80GB)
version: v5
variant: v5c
experiment_name: v5c_r18_colab
rounds: 18
domain_mode: int_range
num_bits: 32
msg_bytes_len: 4

bond_dim: 8
branch_mix: 0.25
d_bit: 48
n_heads: 3
n_blocks: 2
d_ff_mult: 2
share_blocks: false
grad_checkpointing: false
use_carry_gru: true
grad_scale: 2.0

batch_size: 32
num_particles: 1
K_unroll: 10
bptt_chunk_len: 5
use_async_prefetch: true

alpha_phys: 1.0
bce_weight: 0.25
logit_reg_weight: 0.001

K_infer: 16
anneal_K: 256
anneal_chunk_size: 16
anneal_eval_samples: 64

steps: 2000
lr_total_steps: 4000
warmup_steps: 200
lr: 4.0e-4
min_lr_ratio: 0.1
weight_decay: 0.02
grad_clip: 1.0
ema_decay: 0.995

holdout_size: 2048
eval_batch_size: 256
eval_every: 250
checkpoint_every: 250
log_every: 50
best_ckpt_name: best.pt
latest_ckpt_name: latest.pt

cuda_memory_fraction: 0.92
use_torch_compile: "false"
seed: 5053
holdout_seed: 20261122
